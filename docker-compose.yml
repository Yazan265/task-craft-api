services:
  # تطبيق Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskcraft-app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: task_craft
      DB_USERNAME: taskcraft
      DB_PASSWORD: secret
    depends_on:
      - db
    networks:
      - taskcraft-network

  # خادم الويب (Nginx) يستقبل الطلبات ويمررها لـ PHP-FPM
  webserver:
    image: nginx:alpine
    container_name: taskcraft-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - taskcraft-network

  # قاعدة البيانات
  db:
    image: mysql:8.0
    container_name: taskcraft-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_craft
      MYSQL_USER: taskcraft
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - taskcraft-db-data:/var/lib/mysql
    networks:
      - taskcraft-network

networks:
  taskcraft-network:
    driver: bridge

volumes:
  taskcraft-db-data:
